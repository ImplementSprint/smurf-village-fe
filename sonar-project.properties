sonar.javascript.lcov.reportPaths=coverage/lcov-sonar.info,coverage/lcov.info

# Only measure coverage on the 5 lib utilities that have unit tests.
# Everything else — pages, components, data, types, tests, and untested lib files — is excluded.
sonar.coverage.exclusions=\
  src/app/**,\
  src/components/**,\
  src/data/**,\
  src/types/**,\
  tests/**,\
  src/lib/adminApi.ts,\
  src/lib/api.ts,\
  src/lib/authApi.ts,\
  src/lib/authStorage.ts,\
  src/lib/candidateApi.ts,\
  src/lib/changeRequestApi.ts,\
  src/lib/hrDirectoryApi.ts,\
  src/lib/notificationsApi.ts,\
  src/lib/onboardingApi.ts,\
  src/lib/payrollApi.ts,\
  src/lib/securityApi.ts,\
  src/lib/useIdleTimeout.ts,\
  src/lib/useWelcomeToast.tsx,\
  src/lib/utils.ts
